# ServisZeka: uygulama + PostgreSQL 16 (pgvector)
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serviszeka}
      POSTGRES_USER: ${POSTGRES_USER:-serviszeka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serviszeka}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env içindeki SQLite adresini compose ortamında Postgres ile ezer
      SZ_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-serviszeka}:${POSTGRES_PASSWORD:-serviszeka}@db:5432/${POSTGRES_DB:-serviszeka}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
