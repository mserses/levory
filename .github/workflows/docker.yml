name: ServisZeka Docker imajları

# main'e gelen her ServisZeka değişikliğinde ve "serviszeka-v*" etiketlerinde imajları derleyip
# GitHub Container Registry'ye (ghcr.io) yayınlar. Elle çalıştırmak için: Actions > bu iş akışı > Run.
on:
  push:
    branches: [main]
    tags: ["serviszeka-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: serviszeka-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # API: üretim ve demo için aynı imaj; davranış ortam değişkenleriyle seçilir
          - name: serviszeka-api
            context: .
            build_args: ""
          # Portal (demo): dev girişi ve API http://localhost:8000 pakete gömülü.
          # Üretim portalı kurumun OIDC/API adresleriyle kendi derlemesini gerektirir (docs/KURULUM.md).
          - name: serviszeka-portal-demo
            context: portal
            build_args: |
              VITE_API_BASE_URL=http://localhost:8000
              VITE_AUTH_MODE=dev
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: GHCR girişi
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiketler
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=match,pattern=serviszeka-v(.*),group=1

      - name: Derle ve yayınla
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
